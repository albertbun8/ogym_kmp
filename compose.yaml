services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ogym
      POSTGRES_USER: ogym
      POSTGRES_PASSWORD: ogym
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogym -d ogym"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ogym-postgres-data:/var/lib/postgresql/data

volumes:
  ogym-postgres-data:
